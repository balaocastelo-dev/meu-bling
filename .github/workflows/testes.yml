# Roda todos os testes do MEU BLING a cada envio de código e em todo pedido de merge (PR).
# Se algo quebrar, o PR fica marcado em vermelho antes de ir para o ar.
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/api
      - run: npm test
        env:
          TZ: America/Sao_Paulo
